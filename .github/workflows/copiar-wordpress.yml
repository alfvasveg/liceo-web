name: Copiar archivos y contenido del WordPress

# Corre al subir este archivo o a mano desde la pestaña Actions.
# Última ejecución pedida: hoja de inscripción e imagen de Inscripciones.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/copiar-wordpress.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar imágenes y PDF y enlazarlos en el sitio
        run: python3 scripts/descargar-archivos.py || true
      - name: Respaldar páginas y blog del WordPress
        run: python3 scripts/respaldar-wordpress.py || true
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -A assets respaldo index.html
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Copiar imágenes, PDF y contenido desde el WordPress"
          git push
